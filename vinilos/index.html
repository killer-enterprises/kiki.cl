<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Los vinilos de Kiki</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="La colección de vinilos de Kiki y su lista de deseos.">
<meta property="og:title" content="Los vinilos de Kiki">
<meta property="og:description" content="Lo que ya está en la repisa y lo que me gustaría tener.">
<meta property="og:image" content="https://kiki.cl/vinilos/covers/daftpunk.jpg">
<meta name="theme-color" content="#f6f2eb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS (paleta kiki.cl, más hacia el verde) ─────────── */
:root {
  --ink:    #1f1e1b;
  --cream:  #f6f2eb;
  --parch:  #ede7da;
  --sage:   #6b7a65;
  --moss:   #4c5a47;
  --fern:   #a9b59f;
  --mist:   #dfe3d6;
  --gold:   #b89c6e;
  --muted:  #8a8378;
  --line:   rgba(107,122,101,0.22);
  --shadow: 0 1px 2px rgba(31,30,27,.08), 0 8px 24px -12px rgba(31,30,27,.28);
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans:  'Jost', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 999; opacity: .6;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 1.5px solid var(--sage); outline-offset: 3px; }

.wrap { max-width: 980px; margin: 0 auto; padding: 0 22px; }

/* ─── HEADER ──────────────────────────────────────────────── */
header.hero {
  padding-top: calc(38px + env(safe-area-inset-top)); padding-bottom: 26px;
  position: relative;
}
.kicker {
  font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
  color: var(--sage); display: flex; align-items: center; gap: 12px;
}
.kicker a { color: inherit; text-decoration: none; }
.kicker::after { content: ''; height: 1px; flex: 0 0 48px; background: var(--fern); }
h1 {
  font-family: var(--serif); font-weight: 300;
  font-size: clamp(46px, 11vw, 92px); line-height: .92;
  letter-spacing: -.01em; margin: 18px 0 14px;
}
h1 em { font-style: italic; color: var(--moss); }
.lede {
  font-family: var(--serif); font-size: clamp(18px, 4.4vw, 22px); font-style: italic;
  color: var(--muted); max-width: 30em; line-height: 1.35;
}
.hero-disc {
  position: absolute; right: -40px; top: 30px; width: 210px; height: 210px; border-radius: 50%;
  background:
    radial-gradient(circle, var(--gold) 0 17%, #2a2926 17.5% 19%, transparent 19.5%),
    repeating-radial-gradient(circle, #23221f 0 1.2px, #2d2c28 1.2px 2.6px);
  box-shadow: var(--shadow); opacity: .9;
  animation: spin 14s linear infinite; z-index: -1;
}
.hero-disc::after {
  content: ''; position: absolute; inset: 47%; border-radius: 50%; background: var(--cream);
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 640px) { .hero-disc { width: 150px; height: 150px; right: -62px; top: 22px; opacity: .85; } }
@media (prefers-reduced-motion: reduce) { .hero-disc { animation: none; } }

/* ─── TABS ────────────────────────────────────────────────── */
.tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px;
  background: rgba(237,231,218,.6); max-width: 440px; margin-top: 26px;
}
.tab {
  border-radius: 999px; padding: 11px 10px; font-size: 13px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); transition: background .25s, color .25s;
  display: flex; justify-content: center; align-items: baseline; gap: 8px;
}
.tab b { font-family: var(--serif); font-weight: 400; font-size: 18px; letter-spacing: 0; text-transform: none; }
.tab[aria-selected="true"] { background: var(--moss); color: var(--cream); }

/* ─── TOOLBAR ─────────────────────────────────────────────── */
.toolbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(246,242,235,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 12px 0 10px;
}
.search-row { display: flex; gap: 10px; align-items: center; }
.search {
  flex: 1; display: flex; align-items: center; gap: 10px;
  background: #fbf9f4; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px;
}
.search svg { flex: none; color: var(--sage); }
.search input {
  width: 100%; border: 0; background: none; outline: none; font: inherit; font-size: 16px;
  padding: 12px 0; color: var(--ink);
}
.search input::placeholder { color: #a8a195; }
.viewtoggle { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fbf9f4; }
.viewtoggle button { padding: 11px 12px; color: var(--muted); display: grid; place-items: center; }
.viewtoggle button[aria-pressed="true"] { background: var(--mist); color: var(--moss); }
.chips {
  display: flex; gap: 7px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, #000 92%, transparent);
          mask-image: linear-gradient(90deg, #000 92%, transparent);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font-size: 12.5px; letter-spacing: .04em; padding: 6px 13px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--moss); background: transparent; white-space: nowrap;
  transition: background .2s, color .2s;
}
.chip[aria-pressed="true"] { background: var(--sage); border-color: var(--sage); color: var(--cream); }

/* ─── LAYOUT ──────────────────────────────────────────────── */
main { padding: 8px 0 80px; position: relative; }
#list { min-width: 0; }
.layout.solo { grid-template-columns: minmax(0, 1fr); }
.layout { display: grid; grid-template-columns: 1fr 26px; gap: 18px; }
@media (max-width: 640px) { .layout { grid-template-columns: 1fr 18px; gap: 8px; } }

.rail {
  position: sticky; top: 140px; align-self: start;
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding-top: 18px;
}
.rail button {
  font-family: var(--serif); font-size: 13px; line-height: 1; padding: 2.5px 4px; color: #c9c2b5;
  pointer-events: none;
}
.rail button.has { color: var(--sage); pointer-events: auto; font-weight: 500; }
.rail button.has:hover { color: var(--ink); }
@media (max-width: 640px) { .rail { top: 128px; } .rail button { font-size: 11.5px; padding: 2px 2px; } }

.status {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  padding: 18px 0 4px;
}

/* ─── LIST VIEW ───────────────────────────────────────────── */
.group { scroll-margin-top: 130px; }
.letter {
  font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 44px; line-height: 1;
  color: var(--fern); padding: 22px 0 6px; display: flex; align-items: center; gap: 14px;
}
.letter::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.row {
  width: 100%; text-align: left; display: grid; grid-template-columns: auto 1fr auto; gap: 18px;
  align-items: center; padding: 12px 6px 12px 0; border-bottom: 1px solid var(--line);
  position: relative;
}
.row:last-child { border-bottom: 0; }
.sleeve { position: relative; width: 84px; height: 84px; flex: none; }
.sleeve img, .sleeve .ph {
  position: relative; z-index: 2; width: 100%; height: 100%; object-fit: cover;
  border-radius: 2px; box-shadow: var(--shadow); background: var(--parch);
}
.disc {
  position: absolute; z-index: 1; top: 4%; left: 4%; width: 92%; height: 92%; border-radius: 50%;
  background:
    radial-gradient(circle, transparent 0 3.5%, #1b1a18 4% 5%, transparent 5.5%),
    repeating-radial-gradient(circle, #1f1e1b 0 1px, #2c2b27 1px 2.2px);
  transition: transform .55s cubic-bezier(.2,.8,.2,1);
  box-shadow: 0 2px 10px rgba(0,0,0,.25);
}
.disc::after {
  content: ''; position: absolute; inset: 33%; border-radius: 50%;
  background: var(--label, var(--gold)) center/cover;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
}
.disc::before {
  content: ''; position: absolute; inset: 48.5%; border-radius: 50%; background: var(--cream); z-index: 2;
}
@media (hover: hover) {
  .row:hover .disc { transform: translateX(42%) rotate(40deg); }
  .row:hover .meta .album { color: var(--moss); }
}
.row:focus-visible .disc { transform: translateX(42%) rotate(40deg); }
.meta { min-width: 0; padding-left: 0; transition: transform .4s; }
@media (hover: hover) { .row:hover .meta { transform: translateX(22px); } }
.artist {
  font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--sage);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.album {
  font-family: var(--serif); font-size: 23px; line-height: 1.12; font-weight: 400; margin-top: 3px;
  transition: color .3s;
}
.tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 11px; letter-spacing: .05em; color: var(--muted); border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 9px;
}
.tag.note { color: #8c6a3a; border-color: rgba(184,156,110,.55); background: rgba(184,156,110,.1); }
.year { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--muted); }
@media (max-width: 640px) {
  .row { gap: 14px; grid-template-columns: auto 1fr; }
  .sleeve { width: 70px; height: 70px; }
  .album { font-size: 20px; }
  .year { display: none; }
}

/* ─── GRID VIEW ───────────────────────────────────────────── */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 26px 18px;
  padding-top: 18px;
}
@media (max-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px; } }
.card { text-align: left; display: block; width: 100%; min-width: 0; align-self: start; }
.card .sleeve { width: 100%; height: auto; aspect-ratio: 1; }
.card .disc { top: 3%; left: 3%; width: 94%; height: 94%; }
@media (hover: hover) { .card:hover .disc { transform: translateX(30%) rotate(30deg); } }
.card .artist { margin-top: 12px; font-size: 10.5px; }
.card .album { font-size: 18px; }

/* ─── WISHLIST ────────────────────────────────────────────── */
.gift {
  margin: 22px 0 4px; padding: 20px 22px; border-radius: 14px;
  background: var(--mist); border: 1px solid rgba(107,122,101,.25);
  display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start;
}
.gift svg { color: var(--moss); margin-top: 3px; }
.gift h2 { font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.1; }
.gift p { font-size: 14.5px; line-height: 1.55; color: #4b4a44; margin-top: 6px; }
.ph {
  display: flex; flex-direction: column; justify-content: space-between; padding: 9%;
  color: var(--cream); overflow: hidden; position: relative;
}
.ph::before {
  content: ''; position: absolute; width: 74%; aspect-ratio: 1; right: -34%; bottom: -34%; border-radius: 50%;
  background: repeating-radial-gradient(circle, rgba(0,0,0,.22) 0 1px, rgba(0,0,0,.12) 1px 2.4px);
}
.ph .t { font-family: var(--serif); font-style: italic; line-height: 1.02; position: relative; }
.ph .a { font-size: 8px; letter-spacing: .2em; text-transform: uppercase; opacity: .85; position: relative; }
.row .ph .t { font-size: 12px; }
.row .ph .a { font-size: 6.5px; }
.card .ph .t { font-size: 21px; }
.card .ph .a { font-size: 9.5px; }
.wish-badge {
  font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold);
}

/* ─── EMPTY / GIFT CHECK ──────────────────────────────────── */
.empty {
  padding: 40px 0; text-align: center; color: var(--muted);
}
.empty .big { font-family: var(--serif); font-style: italic; font-size: 26px; color: var(--ink); }
.empty p { margin-top: 8px; font-size: 14.5px; line-height: 1.5; }
.empty button { margin-top: 14px; color: var(--moss); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* ─── DETAIL DIALOG ───────────────────────────────────────── */
dialog {
  border: 0; padding: 0; background: transparent; color: var(--ink);
  max-width: min(760px, 100vw); width: 100%; margin: auto;
}
dialog::backdrop { background: rgba(31,30,27,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.sheet {
  background: var(--cream); border-radius: 18px; overflow: hidden; position: relative;
  display: grid; grid-template-columns: 1.05fr 1fr; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5);
}
.sheet .art { position: relative; padding: 34px 84px 34px 34px; display: flex; align-items: center; background: var(--parch); overflow: hidden; }
.sheet .art .sleeve { width: 100%; height: auto; aspect-ratio: 1; }
.sheet .art .disc { transition: transform .9s cubic-bezier(.2,.8,.2,1) .15s; }
dialog[open] .sheet .art .disc { transform: translateX(30%) rotate(120deg); }
.sheet .info { padding: 34px 30px 30px; display: flex; flex-direction: column; }
.sheet .artist { font-size: 12px; white-space: normal; }
.sheet .album { font-size: 34px; line-height: 1.04; margin-top: 8px; }
.sheet dl { margin-top: 22px; display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; font-size: 14px; }
.sheet dt { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
.sheet .callout {
  margin-top: 22px; padding: 14px 16px; border-radius: 10px; font-size: 14px; line-height: 1.5;
  background: rgba(184,156,110,.13); border: 1px solid rgba(184,156,110,.4); color: #5e4a2b;
}
.sheet .callout strong { display: block; font-weight: 500; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 4px; color: #8c6a3a; }
.sheet .callout.wish { background: var(--mist); border-color: rgba(107,122,101,.3); color: var(--moss); }
.sheet .callout.wish strong { color: var(--sage); }
.close {
  position: absolute; top: 12px; right: 12px; z-index: 5; width: 38px; height: 38px; border-radius: 50%;
  background: rgba(246,242,235,.9); display: grid; place-items: center; box-shadow: var(--shadow);
}
.nav { margin-top: auto; padding-top: 24px; display: flex; justify-content: space-between; gap: 10px; }
.nav button { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--sage); padding: 8px 0; }
.nav button:disabled { opacity: .3; cursor: default; }
@media (max-width: 640px) {
  dialog { margin: auto 0 0; max-height: 94vh; }
  .sheet { grid-template-columns: 1fr; border-radius: 20px 20px 0 0; max-height: 94vh; overflow-y: auto; }
  .sheet .art { padding: 26px 70px 26px 26px; }
  .sheet .info { padding: 22px 24px calc(24px + env(safe-area-inset-bottom)); }
  .sheet .album { font-size: 29px; }
  dialog[open] .sheet .art .disc { transform: translateX(28%) rotate(120deg); }
}

footer {
  border-top: 1px solid var(--line); padding: 26px 0 calc(40px + env(safe-area-inset-bottom));
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
footer a { color: var(--sage); text-decoration: none; }

.fade-in { animation: fade .45s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } .disc { transition: none; } }
</style>
</head>
<body>

<header class="hero wrap">
  <div class="hero-disc" aria-hidden="true"></div>
  <div class="kicker"><a href="/">kiki.cl</a> · Repositorio</div>
  <h1>Los vinilos<br>de <em>Kiki</em></h1>
  <p class="lede">Lo que ya suena en casa y lo que me gustaría tener.</p>
  <div class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" id="tab-repisa" aria-selected="true" data-tab="repisa">En la repisa <b id="n-repisa">·</b></button>
    <button class="tab" role="tab" id="tab-deseos" aria-selected="false" data-tab="deseos">Lista de deseos</button>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="search-row">
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="¿Ya lo tiene? Busca artista o disco" autocomplete="off" aria-label="Buscar">
      </label>
      <div class="viewtoggle" role="group" aria-label="Vista">
        <button data-view="lista" aria-pressed="true" aria-label="Vista de lista">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 6h11M9 12h11M9 18h11"/><rect x="3" y="4.5" width="3" height="3" rx=".5"/><rect x="3" y="10.5" width="3" height="3" rx=".5"/><rect x="3" y="16.5" width="3" height="3" rx=".5"/></svg>
        </button>
        <button data-view="grilla" aria-pressed="false" aria-label="Vista de carátulas">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg>
        </button>
      </div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por género"></div>
  </div>
</div>

<main class="wrap">
  <div id="gift"></div>
  <div class="layout">
    <div id="list" aria-live="polite"></div>
    <nav class="rail" id="rail" aria-label="Índice alfabético"></nav>
  </div>
</main>

<footer class="wrap">
  <span id="updated"></span>
  <a href="/">← kiki.cl</a>
</footer>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<script>
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const WISH_TONES = ['#6b7a65', '#4c5a47', '#b89c6e', '#8a8378', '#7d8c6f', '#9a7f55', '#5d6b58', '#a3906f', '#68705f'];
const state = { tab: 'repisa', q: '', genre: 'Todos', view: 'lista' };
let DATA = { coleccion: [], deseos: [] };

const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const sortKey = a => norm(a.artista).replace(/^the\s+/, '');
const letterOf = a => { const c = sortKey(a).charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : '#'; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function sorted(arr) {
  return [...arr].sort((a, b) => sortKey(a).localeCompare(sortKey(b), 'es') || (a.anio || 0) - (b.anio || 0));
}
function items() { return state.tab === 'repisa' ? DATA.coleccion : DATA.deseos; }
function matches(a, q) {
  if (!q) return true;
  const hay = norm([a.artista, a.subartista, a.album, a.genero, a.anio].join(' '));
  return norm(q).split(/\s+/).every(t => hay.includes(t));
}
function filtered() {
  return sorted(items()).filter(a => (state.genre === 'Todos' || a.genero === state.genre) && matches(a, state.q));
}

function sleeve(a, i) {
  if (a.cover) {
    return `<div class="sleeve"><span class="disc" style="--label:url('${esc(a.cover)}')"></span>
      <img src="${esc(a.cover)}" alt="Carátula de ${esc(a.album)}, de ${esc(a.artista)}" loading="lazy" decoding="async"></div>`;
  }
  const tone = WISH_TONES[i % WISH_TONES.length];
  return `<div class="sleeve"><span class="disc" style="--label:${tone}"></span>
    <div class="ph" style="background:${tone}" role="img" aria-label="${esc(a.album)}, de ${esc(a.artista)} (aún no lo tengo)">
      <span class="a">${esc(a.artista)}</span><span class="t">${esc(a.album)}</span></div></div>`;
}
function tags(a) {
  const t = [`<span class="tag">${esc(a.genero)}</span>`];
  if (a.edicion) t.push(`<span class="tag">${esc(a.edicion)}</span>`);
  if (a.nota) t.push(`<span class="tag note">Ojo: ver nota</span>`);
  return t.join('');
}

function render() {
  const list = document.getElementById('list');
  const rail = document.getElementById('rail');
  const all = sorted(items());
  const rows = filtered();
  const idx = new Map(all.map((a, i) => [a.id, i]));

  // Gift banner (wishlist tab only)
  document.getElementById('gift').innerHTML = state.tab === 'deseos' ? `
    <div class="gift fade-in">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1.5"/><path d="M3 12h18M12 8v13M12 8S10.5 3 7.8 3.6C5.6 4.1 6.6 8 12 8Zm0 0s1.5-5 4.2-4.4C18.4 4.1 17.4 8 12 8Z"/></svg>
      <div><h2>¿Quieres regalarme un vinilo?</h2>
      <p>Cualquiera de estos me haría feliz. Antes de comprar, revisa que no esté ya en la repisa: si aparece allá, ya lo tengo.</p></div>
    </div>` : '';

  // Status
  let html = `<div class="status">${rows.length} ${rows.length === 1 ? 'disco' : 'discos'}${state.genre !== 'Todos' ? ' · ' + esc(state.genre) : ''}${state.q ? ' · “' + esc(state.q) + '”' : ''}</div>`;

  if (!rows.length) {
    html += emptyState();
  } else if (state.view === 'grilla') {
    html += `<div class="grid fade-in">` + rows.map(a => `
      <button class="card" data-id="${esc(a.id)}">${sleeve(a, idx.get(a.id))}
        <div class="artist">${esc(a.artista)}</div><div class="album">${esc(a.album)}</div></button>`).join('') + `</div>`;
  } else {
    const groups = {};
    rows.forEach(a => (groups[letterOf(a)] ||= []).push(a));
    html += Object.keys(groups).sort().map(L => `
      <section class="group fade-in" id="L-${L}"><div class="letter" aria-hidden="true">${L}</div>
      ${groups[L].map(a => `
        <button class="row" data-id="${esc(a.id)}">
          ${sleeve(a, idx.get(a.id))}
          <div class="meta">
            <div class="artist">${esc(a.artista)}${a.subartista ? ' · ' + esc(a.subartista) : ''}</div>
            <div class="album">${esc(a.album)}</div>
            <div class="tags">${tags(a)}</div>
          </div>
          <div class="year">${esc(a.anio)}</div>
        </button>`).join('')}
      </section>`).join('');
  }
  list.innerHTML = html;

  // Rail
  const present = new Set(rows.map(letterOf));
  const showRail = state.view === 'lista' && rows.length > 0;
  rail.style.display = showRail ? '' : 'none';
  document.querySelector('.layout').classList.toggle('solo', !showRail);
  rail.innerHTML = ALPHA.map(L => `<button class="${present.has(L) ? 'has' : ''}" data-L="${L}" aria-label="Ir a la ${L}" ${present.has(L) ? '' : 'tabindex="-1" aria-hidden="true"'}>${L}</button>`).join('');

  renderChips();
}

function emptyState() {
  const q = state.q.trim();
  if (state.tab === 'repisa' && q) {
    const inWish = DATA.deseos.filter(a => matches(a, q));
    if (inWish.length) {
      return `<div class="empty"><div class="big">Todavía no lo tengo… y está en mi lista de deseos</div>
        <p>${inWish.map(a => `<em>${esc(a.album)}</em>, de ${esc(a.artista)}`).join('<br>')}</p>
        <button data-goto="deseos">Ver la lista de deseos</button></div>`;
    }
    return `<div class="empty"><div class="big">No está en la repisa</div>
      <p>No tengo nada que coincida con “${esc(q)}”. Si es para regalo, no lo voy a tener repetido.</p>
      <button data-goto="deseos">Ver lo que me gustaría tener</button></div>`;
  }
  if (state.tab === 'deseos' && q) {
    const owned = DATA.coleccion.filter(a => matches(a, q));
    if (owned.length) {
      return `<div class="empty"><div class="big">¡Ese ya lo tengo!</div>
        <p>${owned.map(a => `<em>${esc(a.album)}</em>, de ${esc(a.artista)}`).join('<br>')}</p>
        <button data-goto="repisa">Ver la repisa</button></div>`;
    }
  }
  return `<div class="empty"><div class="big">Nada por aquí</div><p>Prueba con otro nombre o quita el filtro.</p></div>`;
}

function renderChips() {
  const genres = [...new Set(items().map(a => a.genero))].sort((a, b) => a.localeCompare(b, 'es'));
  if (!genres.includes(state.genre)) state.genre = 'Todos';
  document.getElementById('chips').innerHTML = ['Todos', ...genres].map(g =>
    `<button class="chip" aria-pressed="${g === state.genre}" data-genre="${esc(g)}">${esc(g)}</button>`).join('');
}

function setTab(t) {
  state.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  render();
}

// ─── Detail sheet ─────────────────────────────────────────
const dlg = document.getElementById('dlg');
let current = [];
function openDetail(id) {
  current = filtered();
  const i = current.findIndex(a => a.id === id);
  if (i < 0) return;
  const a = current[i];
  const isWish = state.tab === 'deseos';
  const allIdx = sorted(items()).findIndex(x => x.id === id);
  dlg.innerHTML = `
    <div class="sheet">
      <button class="close" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="art">${sleeve(a, allIdx)}</div>
      <div class="info">
        <div class="artist">${esc(a.artista)}${a.subartista ? ' · ' + esc(a.subartista) : ''}</div>
        <div class="album" id="dlg-title">${esc(a.album)}</div>
        <dl>
          <dt>Año</dt><dd>${esc(a.anio)}</dd>
          <dt>Género</dt><dd>${esc(a.genero)}</dd>
          ${a.edicion ? `<dt>Edición</dt><dd>${esc(a.edicion)}</dd>` : ''}
          <dt>Estado</dt><dd>${isWish ? 'En la lista de deseos' : 'En la repisa'}</dd>
        </dl>
        ${a.nota ? `<div class="callout"><strong>Nota</strong>${esc(a.nota)}</div>` : ''}
        ${a.comentario ? `<div class="callout wish"><strong>Comentario</strong>${esc(a.comentario)}</div>` : ''}
        ${isWish ? `<div class="callout wish"><strong>Para regalar</strong>Todavía no lo tengo. Busca la edición en vinilo (LP).</div>` : ''}
        <div class="nav">
          <button data-step="-1" ${i === 0 ? 'disabled' : ''}>← Anterior</button>
          <button data-step="1" ${i === current.length - 1 ? 'disabled' : ''}>Siguiente →</button>
        </div>
      </div>
    </div>`;
  dlg.dataset.i = i;
  if (!dlg.open) { dlg.showModal(); document.body.style.overflow = 'hidden'; }
}
function step(d) {
  const i = +dlg.dataset.i + d;
  if (i >= 0 && i < current.length) {
    openDetail(current[i].id);
  }
}
dlg.addEventListener('close', () => { document.body.style.overflow = ''; });
dlg.addEventListener('click', e => {
  if (e.target === dlg || e.target.closest('.close')) return dlg.close();
  const s = e.target.closest('[data-step]'); if (s && !s.disabled) step(+s.dataset.step);
});
document.addEventListener('keydown', e => {
  if (!dlg.open) return;
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});

// ─── Events ───────────────────────────────────────────────
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.tab); });
document.getElementById('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { state.genre = b.dataset.genre; render(); } });
document.querySelector('.viewtoggle').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.view = b.dataset.view;
  document.querySelectorAll('.viewtoggle button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
let t;
document.getElementById('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; render(); }, 120); });
document.getElementById('list').addEventListener('click', e => {
  const g = e.target.closest('[data-goto]'); if (g) { setTab(g.dataset.goto); return; }
  const b = e.target.closest('[data-id]'); if (b) openDetail(b.dataset.id);
});
document.getElementById('rail').addEventListener('click', e => {
  const b = e.target.closest('button.has'); if (!b) return;
  document.getElementById('L-' + b.dataset.L)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// ─── Load ─────────────────────────────────────────────────
fetch('vinilos.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(d => {
    DATA = d;
    document.getElementById('n-repisa').textContent = d.coleccion.length;
    const f = new Date(d.actualizado + 'T12:00:00');
    document.getElementById('updated').textContent = 'Actualizado el ' + f.toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' });
    if (location.hash === '#deseos') state.tab = 'deseos', setTab('deseos'); else render();
  })
  .catch(() => { document.getElementById('list').innerHTML = '<div class="empty"><div class="big">No pude cargar la colección</div><p>Recarga la página en un momento.</p></div>'; });
</script>
</body>
</html>
